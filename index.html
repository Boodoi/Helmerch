<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<title>&#1061;&#1101;&#1083;&#1084;&#1101;&#1088;&#1095; MN&#8644;EN</title>
<style>
  :root{
    --bg:#0f1720; --card:#17222e; --line:#26364a; --fg:#e8eef5; --muted:#8aa0b6;
    --mn:#3fb68b; --en:#5b9cf2; --warn:#f2b45b; --err:#f26b5b;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;
       padding:env(safe-area-inset-top,0) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(14px,env(safe-area-inset-left,0px))}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
  header h1{font-size:18px;margin:0;letter-spacing:.02em}
  header button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:6px 12px;font-size:14px}
  #status{font-size:14px;color:var(--muted);min-height:20px;padding-bottom:6px}
  #status.err{color:var(--err)} #status.live{color:var(--warn)}
  #log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
  .empty{color:var(--muted);text-align:center;margin:auto;max-width:28ch}
  .msg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;border-left:4px solid var(--en)}
  .msg.me{border-left-color:var(--mn)}
  .msg .src{font-size:13px;color:var(--muted)}
  .msg .dst{font-size:19px;margin-top:2px}
  .msg .acts{display:flex;gap:8px;margin-top:6px}
  .msg .acts button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:3px 10px;font-size:13px}
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 0 14px}
  .talk{border:0;border-radius:18px;padding:22px 10px;font-size:17px;font-weight:600;color:#fff;line-height:1.25}
  .talk small{display:block;font-weight:400;font-size:13px;opacity:.85;margin-top:4px}
  #btnEn{background:var(--en)} #btnMn{background:var(--mn)}
  .talk.active{outline:4px solid var(--warn);outline-offset:2px;animation:pulse 1s infinite}
  .talk:disabled{opacity:.45}
  @keyframes pulse{50%{opacity:.75}}
  @media (prefers-reduced-motion:reduce){.talk.active{animation:none}}
  dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:16px;width:min(92vw,420px);padding:18px}
  dialog::backdrop{background:#0009}
  dialog h2{margin:0 0 10px;font-size:18px}
  label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px}
  .row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
  .row input{width:auto}
  .dlgacts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
  .dlgacts button{border:0;border-radius:10px;padding:10px 16px;font-size:15px;background:var(--mn);color:#fff}
  .dlgacts button.ghost{background:none;border:1px solid var(--line);color:var(--muted)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  #show{position:fixed;inset:0;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;
        padding:24px;font-size:clamp(28px,8vw,56px);font-weight:600;text-align:center;z-index:9}
</style>
</head>
<body>
<header>
  <h1>&#1061;&#1101;&#1083;&#1084;&#1101;&#1088;&#1095; <span style="color:var(--mn)">MN</span>&#8644;<span style="color:var(--en)">EN</span></h1>
  <button id="btnSettings">&#1058;&#1086;&#1093;&#1080;&#1088;&#1075;&#1086;&#1086;</button>
</header>
<div id="status">&#1058;&#1086;&#1074;&#1095; &#1076;&#1072;&#1088;&#1072;&#1072;&#1076; &#1103;&#1088;&#1080;&#1085;&#1072;. &#1063;&#1080;&#1084;&#1101;&#1101;&#1075;&#1199;&#1081; &#1073;&#1086;&#1083;&#1086;&#1093;&#1086;&#1076; &#1072;&#1074;&#1090;&#1086;&#1084;&#1072;&#1090;&#1072;&#1072;&#1088; &#1086;&#1088;&#1095;&#1091;&#1091;&#1083;&#1085;&#1072;.</div>
<div id="log"><p class="empty" id="empty">&#1071;&#1088;&#1080;&#1072; &#1101;&#1085;&#1076; &#1093;&#1072;&#1088;&#1072;&#1075;&#1076;&#1072;&#1085;&#1072;.<br>&#1062;&#1101;&#1085;&#1093;&#1101;&#1088; &#1090;&#1086;&#1074;&#1095; &#8212; &#1085;&#1257;&#1075;&#1257;&#1257; &#1093;&#1199;&#1085; &#1040;&#1085;&#1075;&#1083;&#1080;&#1072;&#1088; &#1103;&#1088;&#1080;&#1085;&#1072;.<br>&#1053;&#1086;&#1075;&#1086;&#1086;&#1085; &#1090;&#1086;&#1074;&#1095; &#8212; &#1090;&#1072; &#1052;&#1086;&#1085;&#1075;&#1086;&#1083;&#1086;&#1086;&#1088; &#1103;&#1088;&#1080;&#1085;&#1072;.</p></div>
<div class="controls">
  <button class="talk" id="btnEn">&#1058;&#1101;&#1088; &#1103;&#1088;&#1080;&#1085;&#1072;<small>English &#8594; &#1052;&#1086;&#1085;&#1075;&#1086;&#1083;</small></button>
  <button class="talk" id="btnMn">&#1041;&#1080; &#1103;&#1088;&#1080;&#1085;&#1072;<small>&#1052;&#1086;&#1085;&#1075;&#1086;&#1083; &#8594; English</small></button>
</div>

<div id="show" hidden></div>

<dialog id="dlg">
  <h2>&#1058;&#1086;&#1093;&#1080;&#1088;&#1075;&#1086;&#1086;</h2>
  <label for="key">Azure Speech &#1090;&#1199;&#1083;&#1093;&#1199;&#1199;&#1088; (key) &#8212; &#1079;&#1072;&#1072;&#1074;&#1072;&#1083; &#1073;&#1080;&#1096;</label>
  <input id="key" type="password" autocomplete="off" placeholder="xxxxxxxxxxxxxxxx">
  <label for="region">&#1041;&#1199;&#1089; (region)</label>
  <input id="region" placeholder="eastus" autocomplete="off">
  <div class="hint">&#1061;&#1086;&#1086;&#1089;&#1086;&#1085; &#1086;&#1088;&#1093;&#1080;&#1074;&#1086;&#1083; &#1199;&#1085;&#1101;&#1075;&#1199;&#1081; &#1075;&#1086;&#1088;&#1080;&#1084;&#1086;&#1086;&#1088; &#1072;&#1078;&#1080;&#1083;&#1083;&#1072;&#1085;&#1072;. &#1058;&#1199;&#1083;&#1093;&#1199;&#1199;&#1088; &#1079;&#1257;&#1074;&#1093;&#1257;&#1085; &#1101;&#1085;&#1101; &#1091;&#1090;&#1089;&#1072;&#1085;&#1076; &#1093;&#1072;&#1076;&#1075;&#1072;&#1083;&#1072;&#1075;&#1076;&#1072;&#1085;&#1072;.</div>
  <label for="mnVoice">&#1052;&#1086;&#1085;&#1075;&#1086;&#1083; &#1093;&#1086;&#1086;&#1083;&#1086;&#1081; (&#1090;&#1072;&#1085;&#1099; &#1095;&#1080;&#1093;&#1101;&#1085;&#1076;)</label>
  <select id="mnVoice">
    <option value="mn-MN-YesuiNeural">&#1045;&#1089;&#1199;&#1081; (&#1101;&#1084;&#1101;&#1075;&#1090;&#1101;&#1081;)</option>
    <option value="mn-MN-BataaNeural">&#1041;&#1072;&#1090;&#1072;&#1072; (&#1101;&#1088;&#1101;&#1075;&#1090;&#1101;&#1081;)</option>
  </select>
  <label for="enVoice">&#1040;&#1085;&#1075;&#1083;&#1080; &#1093;&#1086;&#1086;&#1083;&#1086;&#1081;</label>
  <select id="enVoice">
    <option value="en-US-JennyNeural">Jenny (US, female)</option>
    <option value="en-US-GuyNeural">Guy (US, male)</option>
    <option value="en-GB-SoniaNeural">Sonia (UK, female)</option>
  </select>
  <div class="row"><input type="checkbox" id="speakEn" checked><label for="speakEn" style="margin:0;color:var(--fg)">&#1040;&#1085;&#1075;&#1083;&#1080; &#1086;&#1088;&#1095;&#1091;&#1091;&#1083;&#1075;&#1099;&#1075; &#1095;&#1072;&#1085;&#1075;&#1072;&#1072;&#1088; &#1093;&#1101;&#1083;&#1101;&#1093;</label></div>
  <div class="row"><input type="checkbox" id="autoShow" checked><label for="autoShow" style="margin:0;color:var(--fg)">&#1040;&#1085;&#1075;&#1083;&#1080; &#1086;&#1088;&#1095;&#1091;&#1091;&#1083;&#1075;&#1099;&#1075; &#1076;&#1101;&#1083;&#1075;&#1101;&#1094;&#1101;&#1085; &#1076;&#1101;&#1101;&#1088; &#1090;&#1086;&#1084;&#1086;&#1086;&#1088; &#1093;&#1072;&#1088;&#1091;&#1091;&#1083;&#1072;&#1093;</label></div>
  <div class="dlgacts">
    <button class="ghost" id="dlgCancel">&#1041;&#1086;&#1083;&#1080;&#1093;</button>
    <button id="dlgSave">&#1061;&#1072;&#1076;&#1075;&#1072;&#1083;&#1072;&#1093;</button>
  </div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/microsoft-cognitiveservices-speech-sdk@1.40.0/distrib/browser/microsoft.cognitiveservices.speech.sdk.bundle-min.js"></script>
<script>
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('hm_'+k); return v===null ? d : v }catch{ return d } },
  set(k, v){ try{ localStorage.setItem('hm_'+k, v) }catch{} }
};
const cfg = {
  key: store.get('key',''), region: store.get('region','eastus'),
  mnVoice: store.get('mnVoice','mn-MN-YesuiNeural'), enVoice: store.get('enVoice','en-US-JennyNeural'),
  speakEn: store.get('speakEn','1')==='1', autoShow: store.get('autoShow','1')==='1'
};

// \u0427\u0438\u0433\u043b\u044d\u043b\u04af\u04af\u0434: \u0445\u044d\u043d\u0438\u0439\u0433 \u0441\u043e\u043d\u0441\u043e\u0445, \u044e\u0443 \u0440\u0443\u0443 \u043e\u0440\u0447\u0443\u0443\u043b\u0430\u0445, \u044f\u043c\u0430\u0440 \u0445\u043e\u043e\u043b\u043e\u0439\u0433\u043e\u043e\u0440 \u0445\u044d\u043b\u044d\u0445
const DIRS = {
  en2mn: { from:'en-US', to:'mn', voice:()=>cfg.mnVoice, speak:()=>true,         who:'them' },
  mn2en: { from:'mn-MN', to:'en', voice:()=>cfg.enVoice, speak:()=>cfg.speakEn,  who:'me'   }
};

let busy = false, recognizer = null, synth = null;

function status(text, cls=''){ const s=$('status'); s.textContent=text; s.className=cls }

function openSettings(){
  $('key').value=cfg.key; $('region').value=cfg.region;
  $('mnVoice').value=cfg.mnVoice; $('enVoice').value=cfg.enVoice;
  $('speakEn').checked=cfg.speakEn; $('autoShow').checked=cfg.autoShow;
  $('dlg').showModal();
}
$('btnSettings').onclick = openSettings;
$('dlgCancel').onclick = () => $('dlg').close();
$('dlgSave').onclick = () => {
  cfg.key=$('key').value.trim(); cfg.region=$('region').value.trim()||'eastus';
  cfg.mnVoice=$('mnVoice').value; cfg.enVoice=$('enVoice').value;
  cfg.speakEn=$('speakEn').checked; cfg.autoShow=$('autoShow').checked;
  for (const k of ['key','region','mnVoice','enVoice']) store.set(k,cfg[k]);
  store.set('speakEn',cfg.speakEn?'1':'0'); store.set('autoShow',cfg.autoShow?'1':'0');
  synth = null; $('dlg').close(); status('\u0425\u0430\u0434\u0433\u0430\u043b\u043b\u0430\u0430.');
};

function addMsg(dir, src, dst){
  $('empty')?.remove();
  const d = DIRS[dir];
  const el = document.createElement('div');
  el.className = 'msg' + (d.who==='me' ? ' me' : '');
  el.innerHTML = '<div class="src"></div><div class="dst"></div><div class="acts"><button data-a="say">\u0414\u0430\u0445\u0438\u043d \u0441\u043e\u043d\u0441\u043e\u0445</button>'
    + (dir==='mn2en' ? '<button data-a="show">\u0422\u043e\u043c\u043e\u043e\u0440 \u0445\u0430\u0440\u0443\u0443\u043b\u0430\u0445</button>' : '') + '</div>';
  el.querySelector('.src').textContent = src;
  el.querySelector('.dst').textContent = dst;
  el.querySelector('[data-a=say]').onclick = () => speak(dst, d.voice());
  const sh = el.querySelector('[data-a=show]'); if (sh) sh.onclick = () => showBig(dst);
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
}

function showBig(text){ const s=$('show'); s.textContent=text; s.hidden=false }
$('show').onclick = () => { $('show').hidden = true };

function speakFree(text, lang){
  return new Promise(res => {
    const done = () => res();
    if (lang === 'mn'){
      // \u0423\u0442\u0441\u0430\u043d\u0434 \u041c\u043e\u043d\u0433\u043e\u043b \u0445\u043e\u043e\u043b\u043e\u0439 \u0431\u0430\u0439\u0432\u0430\u043b \u0430\u0448\u0438\u0433\u043b\u0430\u043d\u0430, \u0431\u0430\u0439\u0445\u0433\u04af\u0439 \u0431\u043e\u043b Google-\u0438\u0439\u043d \u0445\u043e\u043e\u043b\u043e\u0439\u0433 \u043e\u0440\u043e\u043b\u0434\u043e\u043d\u043e
      const v = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith('mn'));
      if (!v){
        const a = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=mn&q=' + encodeURIComponent(text.slice(0,200)));
        a.onended = done; a.onerror = done;
        a.play().catch(done); return;
      }
      const u = new SpeechSynthesisUtterance(text); u.voice = v; u.lang = v.lang;
      u.onend = done; u.onerror = done; speechSynthesis.speak(u); return;
    }
    const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US';
    u.onend = done; u.onerror = done; speechSynthesis.speak(u);
  });
}

function speak(text, voice){
  if (!cfg.key) return speakFree(text, voice.startsWith('mn') ? 'mn' : 'en');
  return new Promise(res => {
    if (!synth){
      const sc = SpeechSDK.SpeechConfig.fromSubscription(cfg.key, cfg.region);
      synth = new SpeechSDK.SpeechSynthesizer(sc, SpeechSDK.AudioConfig.fromDefaultSpeakerOutput());
    }
    const lang = voice.slice(0,5);
    const ssml = `<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xml:lang="${lang}"><voice name="${voice}">${
      text.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</voice></speak>`;
    synth.speakSsmlAsync(ssml, () => res(), err => { status('\u0425\u043e\u043e\u043b\u043e\u0439 \u0433\u0430\u0440\u0433\u0430\u0445\u0430\u0434 \u0430\u043b\u0434\u0430\u0430: '+err,'err'); res() });
  });
}

function listen(dir){
  if (busy) return;
  if (!cfg.key) return listenFree(dir);
  if (!window.SpeechSDK){ status('Azure \u0441\u0430\u043d \u0430\u0447\u0430\u0430\u043b\u0430\u0433\u0434\u0441\u0430\u043d\u0433\u04af\u0439. \u0418\u043d\u0442\u0435\u0440\u043d\u044d\u0442\u044d\u044d \u0448\u0430\u043b\u0433\u0430\u043d\u0430 \u0443\u0443.','err'); return }
  const d = DIRS[dir];
  const tc = SpeechSDK.SpeechTranslationConfig.fromSubscription(cfg.key, cfg.region);
  tc.speechRecognitionLanguage = d.from;
  tc.addTargetLanguage(d.to);
  recognizer = new SpeechSDK.TranslationRecognizer(tc, SpeechSDK.AudioConfig.fromDefaultMicrophoneInput());

  busy = true;
  const btn = dir==='en2mn' ? $('btnEn') : $('btnMn');
  const other = dir==='en2mn' ? $('btnMn') : $('btnEn');
  btn.classList.add('active'); other.disabled = true;
  status(dir==='en2mn' ? '\u0410\u043d\u0433\u043b\u0438 \u044f\u0440\u0438\u0430\u0433 \u0441\u043e\u043d\u0441\u043e\u0436 \u0431\u0430\u0439\u043d\u0430\u2026' : '\u041c\u043e\u043d\u0433\u043e\u043b \u044f\u0440\u0438\u0430\u0433 \u0441\u043e\u043d\u0441\u043e\u0436 \u0431\u0430\u0439\u043d\u0430\u2026', 'live');

  recognizer.recognizing = (_, e) => {
    const part = e.result.translations.get(d.to);
    if (part) status('\u2026 ' + part, 'live');
  };

  recognizer.recognizeOnceAsync(async r => {
    finish();
    if (r.reason === SpeechSDK.ResultReason.TranslatedSpeech){
      const out = r.translations.get(d.to);
      if (!r.text || !out){ status('\u042e\u0443 \u0447 \u0441\u043e\u043d\u0441\u043e\u0433\u0434\u0441\u043e\u043d\u0433\u04af\u0439. \u0414\u0430\u0445\u0438\u043d \u043e\u0440\u043e\u043b\u0434\u043e\u043d\u043e \u0443\u0443.'); return }
      addMsg(dir, r.text, out);
      if (dir==='mn2en' && cfg.autoShow) showBig(out);
      status('\u0425\u044d\u043b\u0436 \u0431\u0430\u0439\u043d\u0430\u2026');
      if (d.speak()) await speak(out, d.voice());
      status('\u0411\u044d\u043b\u044d\u043d.');
    } else if (r.reason === SpeechSDK.ResultReason.NoMatch){
      status('\u042f\u0440\u0438\u0430 \u0442\u0430\u043d\u044c\u0441\u0430\u043d\u0433\u04af\u0439. \u041e\u0439\u0440\u0442\u043e\u0436, \u0442\u043e\u0434 \u044f\u0440\u0438\u043d\u0430 \u0443\u0443.');
    } else if (r.reason === SpeechSDK.ResultReason.Canceled){
      const c = SpeechSDK.CancellationDetails.fromResult(r);
      status('\u0410\u043b\u0434\u0430\u0430: ' + (c.errorDetails || '\u0442\u0430\u0441\u0430\u0440\u043b\u0430\u0430') + ' \u2014 \u0442\u04af\u043b\u0445\u04af\u04af\u0440, \u0431\u04af\u0441\u044d\u044d \u0448\u0430\u043b\u0433\u0430\u043d\u0430 \u0443\u0443.', 'err');
    }
  }, err => { finish(); status('\u0410\u043b\u0434\u0430\u0430: ' + err, 'err') });

  function finish(){
    busy = false; btn.classList.remove('active'); other.disabled = false;
    try{ recognizer.close() }catch{} recognizer = null;
  }
}


async function translateFree(text, from, to){
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=' + from + '&tl=' + to + '&q=' + encodeURIComponent(text);
  const r = await fetch(url);
  if (!r.ok) throw new Error('\u043e\u0440\u0447\u0443\u0443\u043b\u0433\u0430 ' + r.status);
  const j = await r.json();
  return j[0].map(x => x[0]).join('');
}

function listenFree(dir){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ status('\u042d\u043d\u044d \u0445\u04e9\u0442\u04e9\u0447 \u044f\u0440\u0438\u0430 \u0442\u0430\u043d\u0438\u0445 \u0431\u043e\u043b\u043e\u043c\u0436\u0433\u04af\u0439. Chrome \u0430\u0448\u0438\u0433\u043b\u0430\u043d\u0430 \u0443\u0443.','err'); return }
  const d = DIRS[dir];
  const rec = new SR();
  rec.lang = d.from; rec.interimResults = true; rec.maxAlternatives = 1; rec.continuous = false;

  busy = true;
  const btn = dir==='en2mn' ? $('btnEn') : $('btnMn');
  const other = dir==='en2mn' ? $('btnMn') : $('btnEn');
  btn.classList.add('active'); other.disabled = true;
  status(dir==='en2mn' ? '\u0410\u043d\u0433\u043b\u0438 \u044f\u0440\u0438\u0430\u0433 \u0441\u043e\u043d\u0441\u043e\u0436 \u0431\u0430\u0439\u043d\u0430\u2026' : '\u041c\u043e\u043d\u0433\u043e\u043b \u044f\u0440\u0438\u0430\u0433 \u0441\u043e\u043d\u0441\u043e\u0436 \u0431\u0430\u0439\u043d\u0430\u2026', 'live');

  let finalText = '', errored = false;
  rec.onresult = e => {
    let interim = '';
    for (const r of e.results){ if (r.isFinal) finalText = r[0].transcript; else interim += r[0].transcript }
    if (interim) status('\u2026 ' + interim, 'live');
  };
  rec.onerror = e => {
    errored = true;
    const msg = {
      'not-allowed':'\u041c\u0438\u043a\u0440\u043e\u0444\u043e\u043d\u044b \u0437\u04e9\u0432\u0448\u04e9\u04e9\u0440\u04e9\u043b \u04e9\u0433\u04e9\u04e9\u0433\u04af\u0439 \u0431\u0430\u0439\u043d\u0430. \u0425\u0430\u044f\u0433\u0438\u0439\u043d \u043c\u04e9\u0440\u043d\u0438\u0439 \u0437\u04af\u04af\u043d \u0442\u0430\u043b\u044b\u043d \u0442\u044d\u043c\u0434\u0433\u044d\u044d\u0440 \u0437\u04e9\u0432\u0448\u04e9\u04e9\u0440\u043d\u04e9 \u04af\u04af.',
      'no-speech':'\u042e\u0443 \u0447 \u0441\u043e\u043d\u0441\u043e\u0433\u0434\u0441\u043e\u043d\u0433\u04af\u0439. \u0414\u0430\u0445\u0438\u043d \u043e\u0440\u043e\u043b\u0434\u043e\u043d\u043e \u0443\u0443.',
      'language-not-supported':'\u042d\u043d\u044d \u0445\u044d\u043b\u0438\u0439\u0433 \u0442\u0430\u043d\u0438\u0445 \u0431\u043e\u043b\u043e\u043c\u0436\u0433\u04af\u0439 \u0431\u0430\u0439\u043d\u0430.',
      'network':'\u0418\u043d\u0442\u0435\u0440\u043d\u044d\u0442 \u0445\u043e\u043b\u0431\u043e\u043b\u0442\u043e\u043e \u0448\u0430\u043b\u0433\u0430\u043d\u0430 \u0443\u0443.'
    }[e.error] || ('\u0410\u043b\u0434\u0430\u0430: ' + e.error);
    status(msg, 'err');
  };
  rec.onend = async () => {
    busy = false; btn.classList.remove('active'); other.disabled = false;
    if (errored) return;
    if (!finalText){ status('\u042e\u0443 \u0447 \u0441\u043e\u043d\u0441\u043e\u0433\u0434\u0441\u043e\u043d\u0433\u04af\u0439. \u0414\u0430\u0445\u0438\u043d \u043e\u0440\u043e\u043b\u0434\u043e\u043d\u043e \u0443\u0443.'); return }
    try{
      status('\u041e\u0440\u0447\u0443\u0443\u043b\u0436 \u0431\u0430\u0439\u043d\u0430\u2026');
      const out = await translateFree(finalText, d.from.slice(0,2), d.to);
      addMsg(dir, finalText, out);
      if (dir==='mn2en' && cfg.autoShow) showBig(out);
      if (d.speak()) await speak(out, d.voice());
      status('\u0411\u044d\u043b\u044d\u043d. (\u04ae\u043d\u044d\u0433\u04af\u0439 \u0433\u043e\u0440\u0438\u043c)');
    }catch(err){ status('\u041e\u0440\u0447\u0443\u0443\u043b\u0436 \u0447\u0430\u0434\u0441\u0430\u043d\u0433\u04af\u0439: ' + err.message, 'err') }
  };
  try{ rec.start() }catch(err){ busy=false; btn.classList.remove('active'); other.disabled=false; status('\u0410\u043b\u0434\u0430\u0430: '+err.message,'err') }
}

$('btnEn').onclick = () => listen('en2mn');
$('btnMn').onclick = () => listen('mn2en');
if (!cfg.key) status('\u04ae\u043d\u044d\u0433\u04af\u0439 \u0433\u043e\u0440\u0438\u043c: \u0442\u043e\u0432\u0447 \u0434\u0430\u0440\u0430\u0430\u0434 \u044f\u0440\u0438\u043d\u0430. Azure \u0442\u04af\u043b\u0445\u04af\u04af\u0440 \u043e\u0440\u0443\u0443\u043b\u0431\u0430\u043b \u041c\u043e\u043d\u0433\u043e\u043b \u0445\u043e\u043e\u043b\u043e\u0439 \u0438\u043b\u04af\u04af \u0441\u0430\u0439\u043d \u0431\u043e\u043b\u043d\u043e.');
if (window.speechSynthesis) speechSynthesis.getVoices();
</script>
